<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flipbook">
<title>Flipbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#2F4FD8; --chip:#5574EE; --sun:#FFD23F; --sun-ink:#3A2C00;
  --ink:#1D1B3A; --paper:#FFFFFF; --text:#FFFFFF; --no:#9AA3C7; --yes:#FF5A4E;
  --shadow:rgba(10,20,80,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --desk:#16225C; --chip:#2B3C88; --no:#4B5583; --shadow:rgba(0,0,0,.5); }
}
:root[data-theme="dark"]{ --desk:#16225C; --chip:#2B3C88; --no:#4B5583; --shadow:rgba(0,0,0,.5); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--desk);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;background:var(--desk);color:var(--text);
  font-family:"Baloo 2",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.hidden{display:none!important}
.screen{height:100%;display:flex;flex-direction:column}

/* Gallery */
#gallery{padding:18px 20px 0}
.g-head h1{margin:0;padding:4px 4px 16px;font-weight:800;font-size:clamp(36px,6vw,58px);line-height:1}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;padding:10px 6px 28px;align-content:start}
.card-wrap{position:relative}
.card{display:block;width:100%;border:none;padding:10px 10px 4px;background:var(--paper);color:var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--shadow);text-align:left}
.card .pic{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:6px;outline:2px solid #ECEEF7}
.card .count{font-weight:800;font-size:18px;padding:4px 2px 0}
.del{position:absolute;top:-12px;right:-12px;width:42px;height:42px;border:none;border-radius:50%;background:var(--ink);color:#fff;font-size:20px;font-weight:800;box-shadow:0 3px 0 var(--shadow)}
.new-card{min-height:170px;border:4px dashed var(--sun);border-radius:14px;background:transparent;color:var(--sun);font-size:84px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center}

/* Editor */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 12px 2px}
.tool{flex:0 0 auto;width:58px;height:58px;border:none;border-radius:16px;background:var(--chip);font-size:28px;line-height:1;display:grid;place-items:center;box-shadow:0 4px 0 var(--shadow)}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.tool.on{background:var(--sun)}
.tool[disabled]{opacity:.35}
.play{width:70px;height:70px;border-radius:50%;background:var(--sun);color:var(--sun-ink)}
.strip{flex:1;min-width:0;display:flex;align-items:center;gap:9px;overflow-x:auto;padding:10px 4px 12px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.thumb{flex:0 0 auto;width:70px;height:53px;padding:0;border:3px solid transparent;border-radius:9px;background:#fff;overflow:hidden;box-shadow:0 3px 0 var(--shadow);transition:transform .12s}
.thumb.on{border-color:var(--sun);transform:translateY(-5px)}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb.add{background:transparent;border:3px dashed var(--sun);color:var(--sun);font-size:34px;font-weight:800;line-height:1;box-shadow:none}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 14px}
.paper{position:relative;background:var(--paper);border-radius:12px;box-shadow:0 8px 0 var(--shadow)}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;touch-action:none}
#onion{opacity:.2;pointer-events:none}
.tools{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:14px 20px;padding:8px 12px 14px}
.group{display:flex;align-items:flex-end;gap:9px}

/* Crayon box */
.crayons{position:relative;display:flex;align-items:flex-end;gap:6px;height:84px;padding:0 12px}
.crayon{width:38px;height:52px;border:none;padding:0;border-radius:0 0 6px 6px;
  background-color:var(--c);
  background-image:linear-gradient(transparent 46%,rgba(255,255,255,.4) 46% 52%,transparent 52% 62%,rgba(255,255,255,.4) 62% 68%,transparent 68%);
  clip-path:polygon(32% 0,68% 0,100% 26%,100% 100%,0 100%,0 26%);
  transition:height .15s ease-out}
.crayon.on{height:80px}
.box-lip{position:absolute;left:0;right:0;bottom:0;height:24px;background:var(--sun);border-radius:8px 8px 12px 12px;pointer-events:none;box-shadow:0 4px 0 var(--shadow)}
.size .dot{display:block;border-radius:50%;background:var(--cur,#1D1B3A);box-shadow:0 0 0 2px rgba(255,255,255,.7)}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:10;background:var(--desk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.pstage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#playCanvas{display:block;background:#fff;border-radius:12px;box-shadow:0 8px 0 var(--shadow)}
.prow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.prow .tool{width:72px;height:72px;font-size:36px}
#ask{background:rgba(10,15,50,.6)}
.ask-card{background:var(--paper);color:var(--ink);border-radius:24px;padding:24px 30px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:0 8px 0 var(--shadow)}
.ask-icon{font-size:72px;line-height:1}
.ask-btns{display:flex;gap:16px}
.ask-btns button{width:92px;height:74px;border:none;border-radius:18px;font-size:40px;font-weight:800;color:#fff}
#askNo{background:var(--no)} #askYes{background:var(--yes)}
#exportImg{max-width:100%;max-height:100%;border-radius:12px;background:#fff;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#exportMsg{margin:0;font-size:20px;font-weight:600;text-align:center;max-width:32ch}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="gallery" class="screen">
  <header class="g-head"><h1>Flipbooks</h1></header>
  <div class="grid" id="grid"></div>
</section>

<section id="editor" class="screen hidden">
  <div class="topbar">
    <button class="tool" id="homeBtn" aria-label="All flipbooks">🏠</button>
    <div class="strip" id="strip"></div>
    <button class="tool" id="exportBtn" aria-label="Make a movie to save">📤</button>
    <button class="tool play" id="playBtn" aria-label="Play">
      <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z" fill="currentColor"/></svg>
    </button>
  </div>
  <div class="stage" id="stage">
    <div class="paper" id="paper">
      <canvas id="onion" width="800" height="600"></canvas>
      <canvas id="draw" width="800" height="600"></canvas>
    </div>
  </div>
  <div class="tools">
    <div class="crayons" id="crayons"><div class="box-lip" id="lip"></div></div>
    <div class="group" id="sizes"></div>
    <div class="group">
      <button class="tool" id="eraserBtn" aria-label="Eraser">🧽</button>
      <button class="tool" id="undoBtn" aria-label="Undo">↩️</button>
      <button class="tool" id="trashBtn" aria-label="Throw away this page">🗑️</button>
    </div>
  </div>
</section>

<div class="overlay hidden" id="player">
  <div class="pstage" id="pstage"><canvas id="playCanvas" width="800" height="600"></canvas></div>
  <div class="prow" id="speeds"></div>
  <div class="prow"><button class="tool" id="playClose" aria-label="Back to drawing">✏️</button></div>
</div>

<div class="overlay hidden" id="export">
  <div class="pstage"><img id="exportImg" alt="Your flipbook movie" class="hidden"></div>
  <p id="exportMsg"></p>
  <div class="prow">
    <button class="tool hidden" id="shareNow" aria-label="Share">📤</button>
    <button class="tool" id="exportClose" aria-label="Close">✕</button>
  </div>
</div>

<div class="overlay hidden" id="ask">
  <div class="ask-card">
    <div class="ask-icon" id="askIcon"></div>
    <div class="ask-btns">
      <button id="askNo" aria-label="No, keep it">✕</button>
      <button id="askYes" aria-label="Yes, throw it away">✓</button>
    </div>
  </div>
</div>

<script>
(() => {
const W = 800, H = 600, MAX_PAGES = 24;
const COLORS = ['#1D1B3A','#FF3B30','#FF8A00','#FFD400','#2EC84A','#1E88FF','#8A4DFF','#FF5FB8','#8B5A2B','#7FD9FF'];
const NAMES  = ['Black','Red','Orange','Yellow','Green','Blue','Purple','Pink','Brown','Sky blue'];
const SIZES = [8, 18, 36], DOTS = [10, 18, 28];
const SPEEDS = [{e:'🐌', f:2, l:'Slow'}, {e:'🐢', f:4, l:'Medium'}, {e:'🐇', f:8, l:'Fast'}];
const $ = id => document.getElementById(id);

let book = null, cur = 0, color = COLORS[0], size = SIZES[1], erasing = false, fps = 4;
let saveT = null, undoStack = [], ready = false, loadToken = 0;

const canvas = $('draw'), ctx = canvas.getContext('2d', {willReadFrequently: true});
const octx = $('onion').getContext('2d');
const pctx = $('playCanvas').getContext('2d');

/* ---------- storage (IndexedDB, with in-memory fallback) ---------- */
let dbp = null; const mem = new Map();
function openDb() {
  if (!dbp) dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('flipbook', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('books', {keyPath: 'id'});
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  return dbp;
}
async function dbAll() {
  try {
    const db = await openDb();
    return await new Promise((res, rej) => {
      const r = db.transaction('books').objectStore('books').getAll();
      r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error);
    });
  } catch (e) { return [...mem.values()]; }
}
async function dbPut(b) {
  mem.set(b.id, JSON.parse(JSON.stringify(b)));
  try {
    const db = await openDb();
    await new Promise((res, rej) => {
      const t = db.transaction('books', 'readwrite'); t.objectStore('books').put(b);
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  } catch (e) {}
}
async function dbDel(id) {
  mem.delete(id);
  try {
    const db = await openDb();
    await new Promise((res, rej) => {
      const t = db.transaction('books', 'readwrite'); t.objectStore('books').delete(id);
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  } catch (e) {}
}
function touch() {
  book.updated = Date.now();
  clearTimeout(saveT);
  const b = book; saveT = setTimeout(() => dbPut(b), 400);
}
async function flush() { if (book) { clearTimeout(saveT); await dbPut(book); } }

/* ---------- helpers ---------- */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const loadImg = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
function fit(box, el) {
  const cs = getComputedStyle(box);
  const bw = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const bh = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let w = bw, h = w * 0.75;
  if (h > bh) { h = bh; w = h / 0.75; }
  el.style.width = Math.max(0, Math.floor(w)) + 'px';
  el.style.height = Math.max(0, Math.floor(h)) + 'px';
}
function fitAll() { fit($('stage'), $('paper')); fit($('pstage'), $('playCanvas')); }
if (window.ResizeObserver) { const ro = new ResizeObserver(fitAll); ro.observe($('stage')); ro.observe($('pstage')); }
window.addEventListener('resize', fitAll);
document.addEventListener('gesturestart', e => e.preventDefault());

function show(name) {
  $('gallery').classList.toggle('hidden', name !== 'gallery');
  $('editor').classList.toggle('hidden', name !== 'editor');
  if (name === 'editor') requestAnimationFrame(fitAll);
}
function ask(icon) {
  return new Promise(res => {
    $('askIcon').textContent = icon;
    const o = $('ask'); o.classList.remove('hidden');
    const done = v => { o.classList.add('hidden'); $('askYes').onclick = $('askNo').onclick = null; res(v); };
    $('askYes').onclick = () => done(true);
    $('askNo').onclick = () => done(false);
  });
}

/* ---------- gallery ---------- */
async function showGallery() {
  await flush(); book = null;
  stopPlay();
  const books = (await dbAll()).sort((a, b) => b.updated - a.updated);
  const grid = $('grid'); grid.textContent = '';
  const nb = document.createElement('button');
  nb.className = 'new-card'; nb.textContent = '+'; nb.setAttribute('aria-label', 'New flipbook');
  nb.onclick = newBook; grid.append(nb);
  for (const b of books) {
    const wrap = document.createElement('div'); wrap.className = 'card-wrap';
    const open = document.createElement('button'); open.className = 'card'; open.setAttribute('aria-label', 'Open flipbook');
    const first = b.frames.find(f => f);
    const pic = document.createElement(first ? 'img' : 'div'); pic.className = 'pic';
    if (first) { pic.src = first; pic.alt = ''; }
    const count = document.createElement('div'); count.className = 'count';
    count.textContent = b.frames.length + (b.frames.length === 1 ? ' page' : ' pages');
    open.append(pic, count); open.onclick = () => openBook(b);
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '✕';
    del.setAttribute('aria-label', 'Delete flipbook');
    del.onclick = async () => { if (await ask('🗑️📒')) { await dbDel(b.id); showGallery(); } };
    wrap.append(open, del); grid.append(wrap);
  }
  show('gallery');
}
function newBook() {
  const b = {id: uid(), created: Date.now(), updated: Date.now(), frames: ['']};
  dbPut(b); openBook(b);
}
function openBook(b) { book = b; cur = 0; show('editor'); renderStrip(); loadFrame(); }

/* ---------- pages ---------- */
function renderStrip() {
  const s = $('strip'); s.textContent = '';
  book.frames.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'thumb' + (i === cur ? ' on' : '');
    b.setAttribute('aria-label', 'Page ' + (i + 1));
    if (f) { const im = document.createElement('img'); im.src = f; im.alt = ''; b.append(im); }
    b.onclick = () => goTo(i); s.append(b);
  });
  const add = document.createElement('button');
  add.className = 'thumb add'; add.textContent = '+'; add.setAttribute('aria-label', 'Add a page');
  add.disabled = book.frames.length >= MAX_PAGES; add.onclick = addPage; s.append(add);
  const on = s.querySelector('.on');
  if (on) on.scrollIntoView({inline: 'nearest', block: 'nearest'});
}
function updateThumb(i) {
  const b = $('strip').children[i]; if (!b) return;
  let im = b.querySelector('img');
  if (!book.frames[i]) { if (im) im.remove(); return; }
  if (!im) { im = document.createElement('img'); im.alt = ''; b.append(im); }
  im.src = book.frames[i];
}
async function loadFrame() {
  const t = ++loadToken; ready = false;
  undoStack = []; updateUndo();
  const src = book.frames[cur], prev = cur > 0 ? book.frames[cur - 1] : '';
  const [img, pimg] = await Promise.all([src ? loadImg(src) : null, prev ? loadImg(prev) : null]);
  if (t !== loadToken) return;
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H); if (img) ctx.drawImage(img, 0, 0, W, H);
  octx.clearRect(0, 0, W, H); if (pimg) octx.drawImage(pimg, 0, 0, W, H);
  ready = true;
}
function goTo(i) { if (i === cur) return; cur = i; renderStrip(); loadFrame(); }
function addPage() {
  if (book.frames.length >= MAX_PAGES) return;
  book.frames.splice(cur + 1, 0, ''); cur++;
  touch(); renderStrip(); loadFrame();
}
$('trashBtn').onclick = async () => {
  if (!(await ask('🗑️📄'))) return;
  if (book.frames.length === 1) book.frames[0] = '';
  else { book.frames.splice(cur, 1); cur = Math.min(cur, book.frames.length - 1); }
  touch(); renderStrip(); loadFrame();
};

/* ---------- drawing ---------- */
let active = null, last = null;
function pt(e) {
  const r = canvas.getBoundingClientRect();
  return {x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height};
}
function styleCtx() {
  ctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
  ctx.strokeStyle = ctx.fillStyle = color;
  ctx.lineWidth = erasing ? size * 1.8 : size;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
}
function dot(p) { ctx.beginPath(); ctx.arc(p.x, p.y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); }
function seg(a, b) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
canvas.addEventListener('pointerdown', e => {
  if (!ready || active !== null) return;
  e.preventDefault();
  active = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  undoStack.push(ctx.getImageData(0, 0, W, H)); if (undoStack.length > 10) undoStack.shift(); updateUndo();
  styleCtx(); last = pt(e); dot(last);
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== active) return;
  e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) { const p = pt(ev); seg(last, p); last = p; }
});
function endStroke(e) {
  if (e.pointerId !== active) return;
  active = null; commit();
}
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);
function commit() {
  book.frames[cur] = canvas.toDataURL('image/png');
  updateThumb(cur); touch();
}
function updateUndo() { $('undoBtn').disabled = undoStack.length === 0; }
$('undoBtn').onclick = () => {
  const snap = undoStack.pop(); if (!snap) return;
  ctx.globalCompositeOperation = 'source-over';
  ctx.putImageData(snap, 0, 0); updateUndo(); commit();
};

/* ---------- tools ---------- */
const crayonBtns = COLORS.map((c, i) => {
  const b = document.createElement('button'); b.className = 'crayon';
  b.style.setProperty('--c', c); b.setAttribute('aria-label', NAMES[i]);
  b.onclick = () => { color = c; erasing = false; syncTools(); };
  $('crayons').insertBefore(b, $('lip')); return b;
});
const sizeBtns = SIZES.map((s, i) => {
  const b = document.createElement('button'); b.className = 'tool size';
  b.setAttribute('aria-label', ['Thin', 'Medium', 'Thick'][i] + ' brush');
  const d = document.createElement('span'); d.className = 'dot';
  d.style.width = d.style.height = DOTS[i] + 'px'; b.append(d);
  b.onclick = () => { size = s; syncTools(); };
  $('sizes').append(b); return b;
});
$('eraserBtn').onclick = () => { erasing = !erasing; syncTools(); };
function syncTools() {
  crayonBtns.forEach((b, i) => b.classList.toggle('on', !erasing && COLORS[i] === color));
  sizeBtns.forEach((b, i) => b.classList.toggle('on', SIZES[i] === size));
  $('eraserBtn').classList.toggle('on', erasing);
  document.documentElement.style.setProperty('--cur', color);
}
$('homeBtn').onclick = showGallery;

/* ---------- play ---------- */
let playT = null, playImgs = [], pi = 0;
const speedBtns = SPEEDS.map(s => {
  const b = document.createElement('button'); b.className = 'tool'; b.textContent = s.e;
  b.setAttribute('aria-label', s.l);
  b.onclick = () => { fps = s.f; syncSpeed(); };
  $('speeds').append(b); return b;
});
function syncSpeed() { speedBtns.forEach((b, i) => b.classList.toggle('on', SPEEDS[i].f === fps)); }
async function startPlay() {
  flush();
  playImgs = await Promise.all(book.frames.map(f => f ? loadImg(f) : null));
  pi = 0; $('player').classList.remove('hidden');
  fitAll(); syncSpeed(); clearTimeout(playT); tick();
}
function tick() {
  pctx.fillStyle = '#fff'; pctx.fillRect(0, 0, W, H);
  const im = playImgs[pi]; if (im) pctx.drawImage(im, 0, 0, W, H);
  pi = (pi + 1) % playImgs.length;
  playT = setTimeout(tick, 1000 / fps);
}
function stopPlay() { clearTimeout(playT); playT = null; $('player').classList.add('hidden'); }
$('playBtn').onclick = startPlay;
$('playClose').onclick = stopPlay;

/* ---------- GIF export ---------- */
const PAL = ['#FFFFFF', ...COLORS];
while (PAL.length < 16) PAL.push('#FFFFFF');
const PAL_RGB = PAL.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
function nearest(r, g, b) {
  let best = 0, bd = Infinity;
  for (let i = 0; i < 11; i++) {
